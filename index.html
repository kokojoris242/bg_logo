<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floating Objects with Rotating Gravity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        function loadFloatingVideo(url, properties) {
            // Create video element
            const video = document.createElement('video');
            video.src = url;
            video.crossOrigin = 'anonymous';
            video.loop = true;
            video.muted = true;
            video.autoplay = true;
            video.playsInline = true;
            
            video.addEventListener('loadeddata', () => {
                // Create video texture
                const videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;
                
                // Create plane geometry for the video
                const geometry = new THREE.PlaneGeometry(1, 1);
                
                // Custom shader material for green screen keying
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        map: { value: videoTexture },
                        keyColor: { value: new THREE.Vector3(0.0, 1.0, 0.0) }, // Green color to key out
                        threshold: { value: 0.4 }, // Threshold for keying
                        smoothing: { value: 0.1 } // Smoothing for edges
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D map;
                        uniform vec3 keyColor;
                        uniform float threshold;
                        uniform float smoothing;
                        varying vec2 vUv;
                        
                        void main() {
                            vec4 color = texture2D(map, vUv);
                            
                            // Calculate distance from key color (green)
                            float distance = length(color.rgb - keyColor);
                            
                            // Create alpha mask based on distance from key color
                            float alpha = smoothstep(threshold - smoothing, threshold + smoothing, distance);
                            
                            gl_FragColor = vec4(color.rgb, color.a * alpha);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                
                // Scale based on video aspect ratio
                const videoAspectRatio = video.videoWidth / video.videoHeight;
                mesh.scale.set(properties.scale * videoAspectRatio, properties.scale, 1);
                
                mesh.position.set(properties.x, properties.y, 0);
                
                // No shadows for video
                mesh.castShadow = false;
                mesh.receiveShadow = false;
                
                // Floating properties
                mesh.userData = {
                    ...properties,
                    initialY: properties.y,
                    floatOffset: Math.random() * Math.PI * 2,
                    velocity: { x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02 },
                    mass: 0.9,
                    isVideo: true
                };
                
                objects.push(mesh);
                scene.add(mesh);
                
                // Start video playback
                video.play().catch(console.error);
            });
            
            video.addEventListener('error', (error) => {
                console.error('Error loading video:', error);
            });
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        let scene, camera, renderer;
        let objects = [];
        let mouseX = 0, mouseY = 0;
        let isDragging = false;
        let selectedObject = null;
        let mouseWorldPos = new THREE.Vector3();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        window.addEventListener('load', function() {
            init();
        });

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);

            // Camera - Orthographic für 2D Look
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 20;
            camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2, 
                frustumSize * aspect / 2, 
                frustumSize / 2, 
                frustumSize / -2, 
                -1000, 
                1000
            );
            camera.position.set(0, 0, 10);

            // Renderer - ohne Schatten
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Schatten komplett deaktiviert
            renderer.shadowMap.enabled = false;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting - Helles weißes Licht ohne Schatten
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); // Sehr helles weißes Licht
            scene.add(ambientLight);

            // Zusätzliches gleichmäßiges Licht von allen Seiten
            const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
            light1.position.set(1, 1, 1);
            scene.add(light1);

            const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
            light2.position.set(-1, -1, -1);
            scene.add(light2);

            const light3 = new THREE.DirectionalLight(0xffffff, 0.6);
            light3.position.set(1, -1, 1);
            scene.add(light3);

            const light4 = new THREE.DirectionalLight(0xffffff, 0.6);
            light4.position.set(-1, 1, -1);
            scene.add(light4);

            // Load Models mit floating properties - x2_logo 150% bigger (7.5 * 1.5 = 11.25)
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/x2_logo.glb', 
                { x: -8, y: 3, scale: 11.25, rotationSpeed: 0.01, floatSpeed: 0.5, floatRange: 0.3, radius: 3.75 });
            
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/buch.glb', 
                { x: 6, y: -2, scale: 6, rotationSpeed: -0.008, floatSpeed: 0.7, floatRange: 0.4, radius: 2.0 });
            
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/uludag.glb', 
                { x: 0, y: 4, scale: 6.6, rotationSpeed: 0.006, floatSpeed: 0.6, floatRange: 0.35, radius: 2.2 });

            // Add new maske.glb model - 200% bigger
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/maske.glb', 
                { x: -2, y: -3, scale: 11, rotationSpeed: 0.009, floatSpeed: 0.8, floatRange: 0.3, radius: 3.6 });

            // Add tomate.glb model (50% bigger)
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/tomate.glb', 
                { x: -7, y: -1, scale: 7.5, rotationSpeed: 0.012, floatSpeed: 0.9, floatRange: 0.4, radius: 3.75 });

            // Add haase.glb model (30% bigger)
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/haase.glb', 
                { x: 8, y: -3, scale: 5.2, rotationSpeed: -0.010, floatSpeed: 0.7, floatRange: 0.35, radius: 2.6 });

            // Add kase_weintraube.glb model
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/kase_weintraube.glb', 
                { x: -3, y: 4, scale: 6, rotationSpeed: 0.008, floatSpeed: 0.6, floatRange: 0.3, radius: 3.0 });

            // Add MP4 video with green screen keying
            loadFloatingVideo('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/d9da7629-2231-48a6-9087-7074237fb446.mp4', 
                { x: 2, y: -2, scale: 4, rotationSpeed: 0, floatSpeed: 0.4, floatRange: 0.2, radius: 2.0 });

            // Load PNG images as floating textures - enhanced_replicate 300% bigger (no rotation)
            loadFloatingImage('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/enhanced_replicate-prediction-77a5mxf72hrmc0cqthz8p2tqvg.png', 
                { x: -4, y: -4, scale: 9, rotationSpeed: 0, floatSpeed: 0.4, floatRange: 0.2, radius: 4.5 });
            
            // Make pikachu card more visible - 150% bigger and reduced brightness (no rotation)
            loadFloatingImage('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/pikauchu_karte_skiaggu.png', 
                { x: 5, y: 1, scale: 6, rotationSpeed: 0, floatSpeed: 0.6, floatRange: 0.25, radius: 3.0 });

            // Add 5eurodoner website image (reduced brightness, 20% bigger)
            loadFloatingImage('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/5eurodoner_website.png', 
                { x: 1, y: 2, scale: 6, rotationSpeed: 0, floatSpeed: 0.5, floatRange: 0.35, radius: 3.0 });

            // Add DON.glb as floating 3D model
            loadFloatingModel('https://raw.githubusercontent.com/kokojoris242/bg_logo/main/DON.glb', 
                { x: 3, y: -5, scale: 7, rotationSpeed: 0.008, floatSpeed: 0.5, floatRange: 0.3, radius: 3.5 });

            // Mouse controls
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('click', onMouseClick);

            // Animation
            animate();
        }

        function loadFloatingImage(url, properties) {
            const textureLoader = new THREE.TextureLoader();
            
            textureLoader.load(
                url,
                (texture) => {
                    // Create plane geometry for the image
                    const geometry = new THREE.PlaneGeometry(1, 1);
                    const material = new THREE.MeshLambertMaterial({ 
                        map: texture,
                        transparent: true,
                        alphaTest: 0.1,
                        side: THREE.DoubleSide
                    });
                    
                    // Reduced brightness for specific images
                    if (url.includes('pikauchu_karte_skiaggu.png')) {
                        material.color.setHSL(0, 0, 0.4); // Brighter again for Pikachu cards
                    } else if (url.includes('5eurodoner_website.png')) {
                        material.color.setHSL(0, 0, 0.5); // Even darker for 5eurodoner
                    } else if (url.includes('enhanced_replicate-prediction-77a5mxf72hrmc0cqthz8p2tqvg.png')) {
                        material.color.setHSL(0, 0, 0.5); // Darker for enhanced_replicate
                    } else {
                        // Normal brightness for other images
                        material.color.setHSL(0, 0, 0.9); // Heller (0.9) aber ungesättigt
                    }
                    
                    const mesh = new THREE.Mesh(geometry, material);
                    
                    // Scale based on image aspect ratio
                    const imgAspectRatio = texture.image.width / texture.image.height;
                    mesh.scale.set(properties.scale * imgAspectRatio, properties.scale, 1);
                    
                    mesh.position.set(properties.x, properties.y, 0);
                    
                    // No shadows for images
                    mesh.castShadow = false;
                    mesh.receiveShadow = false;
                    
                    // Floating properties
                    mesh.userData = {
                        ...properties,
                        initialY: properties.y,
                        floatOffset: Math.random() * Math.PI * 2,
                        velocity: { x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02 },
                        mass: 0.8, // Lighter than 3D models
                        is3DModel: false // Mark as image to prevent Z rotation
                    };
                    
                    objects.push(mesh);
                    scene.add(mesh);
                },
                undefined,
                (error) => {
                    console.error('Error loading image:', error);
                }
            );
        }

        function loadFloatingModel(url, properties) {
            const loader = new THREE.GLTFLoader();
            
            loader.load(
                url,
                (gltf) => {
                    const model = gltf.scene;
                    
                    // Enable shadows and make brighter
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            // Heller aber ungesättigt für natürlichen Look
                            if (child.material) {
                                child.material.metalness = 0.05; // Wenig metallisch
                                child.material.roughness = 0.8; // Etwas weniger rau für mehr Licht
                                child.material.emissive = new THREE.Color(0x000000); // Kein künstliches Glühen
                                
                                // Enhanced yellow finish for DON.glb with roughness
                                if (url.includes('DON.glb')) {
                                    // Force bright yellow color and override any existing materials
                                    if (child.material.color) {
                                        child.material.color.setRGB(1.0, 1.0, 0.0); // Pure RGB yellow
                                    }
                                    // Create new material if needed to ensure yellow shows
                                    if (!child.material.color || child.material.color.r !== 1.0) {
                                        child.material = new THREE.MeshStandardMaterial({
                                            color: new THREE.Color(1.0, 1.0, 0.0),
                                            metalness: 0.8,
                                            roughness: 0.3, // More roughness for realistic look
                                            envMapIntensity: 3.0,
                                            emissive: new THREE.Color(0.1, 0.1, 0.0)
                                        });
                                    }
                                    child.material.metalness = 0.8; // Metallic but not perfect mirror
                                    child.material.roughness = 0.3; // More roughness for realistic surface
                                    child.material.envMapIntensity = 3.0; // Strong reflections
                                    child.material.emissive.setRGB(0.1, 0.1, 0.0); // Subtle yellow glow
                                } else if (url.includes('x2_logo.glb')) {
                                    // Pink metallic x2_logo - force pink color
                                    if (child.material.color) {
                                        child.material.color.setRGB(1.0, 0.2, 0.8); // Bright pink
                                    }
                                    // Create new material if needed to ensure pink shows
                                    if (!child.material.color || child.material.color.g > 0.3) {
                                        child.material = new THREE.MeshStandardMaterial({
                                            color: new THREE.Color(1.0, 0.2, 0.8),
                                            metalness: 0.8,
                                            roughness: 0.2,
                                            envMapIntensity: 2.0,
                                            emissive: new THREE.Color(0.1, 0.0, 0.05)
                                        });
                                    }
                                    child.material.metalness = 0.8; // Very metallic
                                    child.material.roughness = 0.2; // Slightly rough for realism
                                    child.material.envMapIntensity = 2.0; // Strong reflections
                                    child.material.emissive.setRGB(0.1, 0.0, 0.05); // Slight pink glow
                                } else if (url.includes('kase_weintraube.glb')) {
                                    // Reduce saturation but keep brightness for kase_weintraube
                                    if (child.material.color) {
                                        const hsl = {};
                                        child.material.color.getHSL(hsl);
                                        child.material.color.setHSL(hsl.h, hsl.s * 0.4, hsl.l); // Reduce saturation to 40% of original, keep lightness
                                    }
                                } else {
                                    // Heller aber stark entsättigt for other models
                                    if (child.material.color) {
                                        const hsl = {};
                                        child.material.color.getHSL(hsl);
                                        child.material.color.setHSL(hsl.h, hsl.s * 0.2, hsl.l * 1.1); // Weniger Sättigung, heller
                                    }
                                }
                            }
                        }
                    });
                    
                    // Auto-scale
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = properties.scale / maxDim;
                    
                    model.scale.multiplyScalar(scale);
                    model.position.set(properties.x, properties.y, 0);
                    
                    // Special rotation für x2_logo
                    if (url.includes('x2_logo')) {
                        model.rotation.x = -Math.PI / 2;
                    }
                    
                    // Special blue color for DON.glb
                    if (url.includes('DON.glb')) {
                        model.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.color.setRGB(0, 0, 1); // Pure blue
                            }
                        });
                    }
                    
                    // Zufällige Start-Rotation
                    model.rotation.z = Math.random() * Math.PI * 2;
                    
                    // Floating properties with collision radius
                    model.userData = {
                        ...properties,
                        initialY: properties.y,
                        floatOffset: Math.random() * Math.PI * 2,
                        velocity: { x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02 },
                        mass: 1.0,
                        is3DModel: true // Mark as 3D model to allow Z rotation
                    };
                    
                    objects.push(model);
                    scene.add(model);
                },
                undefined,
                (error) => {
                    console.error('Error loading model:', error);
                }
            );
        }

        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // Update mouse position for raycasting
            mouse.x = mouseX;
            mouse.y = mouseY;
            
            // If dragging, move the selected object
            if (isDragging && selectedObject) {
                // Convert mouse position to world coordinates
                raycaster.setFromCamera(mouse, camera);
                const intersectPoint = raycaster.ray.origin.clone();
                
                // Smooth movement to mouse position
                selectedObject.userData.targetX = intersectPoint.x;
                selectedObject.userData.targetY = intersectPoint.y;
                
                // Reset velocity when manually controlling
                selectedObject.userData.velocity.x *= 0.8;
                selectedObject.userData.velocity.y *= 0.8;
            }
        }

        function onMouseDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects, true);
            
            if (intersects.length > 0) {
                isDragging = true;
                selectedObject = intersects[0].object;
                
                // Find the root object if we hit a child mesh
                while (selectedObject.parent && selectedObject.parent !== scene) {
                    selectedObject = selectedObject.parent;
                }
                
                // Visual feedback - slight scale up
                selectedObject.userData.originalScale = selectedObject.scale.clone();
                selectedObject.scale.multiplyScalar(1.1);
                
                document.body.style.cursor = 'grabbing';
            }
        }

        function onMouseUp(event) {
            if (isDragging && selectedObject) {
                // Reset scale
                if (selectedObject.userData.originalScale) {
                    selectedObject.scale.copy(selectedObject.userData.originalScale);
                }
                
                isDragging = false;
                selectedObject = null;
                document.body.style.cursor = 'default';
            }
        }

        function onMouseClick(event) {
            if (!isDragging) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(objects, true);
                
                if (intersects.length > 0) {
                    let clickedObject = intersects[0].object;
                    
                    // Find the root object
                    while (clickedObject.parent && clickedObject.parent !== scene) {
                        clickedObject = clickedObject.parent;
                    }
                    
                    // Add impulse to clicked object
                    if (clickedObject.userData) {
                        const impulseStrength = 0.05;
                        clickedObject.userData.velocity.x += (Math.random() - 0.5) * impulseStrength;
                        clickedObject.userData.velocity.y += (Math.random() - 0.5) * impulseStrength;
                        
                        // Quick rotation impulse
                        clickedObject.userData.rotationSpeed *= 2;
                        setTimeout(() => {
                            if (clickedObject.userData) {
                                clickedObject.userData.rotationSpeed *= 0.5;
                            }
                        }, 1000);
                    }
                }
            }
        }

        function checkCollisions() {
            for (let i = 0; i < objects.length; i++) {
                for (let j = i + 1; j < objects.length; j++) {
                    const obj1 = objects[i];
                    const obj2 = objects[j];
                    
                    if (!obj1.userData || !obj2.userData) continue;
                    
                    const dx = obj1.position.x - obj2.position.x;
                    const dy = obj1.position.y - obj2.position.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const minDistance = obj1.userData.radius + obj2.userData.radius;
                    
                    if (distance < minDistance && distance > 0) {
                        // Collision detected - bounce objects
                        const overlap = minDistance - distance;
                        const separationX = (dx / distance) * overlap * 0.5;
                        const separationY = (dy / distance) * overlap * 0.5;
                        
                        // Separate objects
                        obj1.position.x += separationX;
                        obj1.position.y += separationY;
                        obj2.position.x -= separationX;
                        obj2.position.y -= separationY;
                        
                        // Calculate bounce velocities
                        const bounceStrength = 0.8;
                        const relativeVelocityX = obj1.userData.velocity.x - obj2.userData.velocity.x;
                        const relativeVelocityY = obj1.userData.velocity.y - obj2.userData.velocity.y;
                        
                        // Apply bounce
                        const bounceX = (dx / distance) * bounceStrength * 0.02;
                        const bounceY = (dy / distance) * bounceStrength * 0.02;
                        
                        obj1.userData.velocity.x += bounceX;
                        obj1.userData.velocity.y += bounceY;
                        obj2.userData.velocity.x -= bounceX;
                        obj2.userData.velocity.y -= bounceY;
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // Rotating gravity like a clock hand
            const gravityAngle = time * 0.5; // Rotation speed
            const gravityStrength = 0.0005;
            const gravityX = Math.cos(gravityAngle) * gravityStrength;
            const gravityY = Math.sin(gravityAngle) * gravityStrength;
            
            objects.forEach((object, index) => {
                if (!object.userData) return;
                
                // Smooth movement towards target if being dragged
                if (object.userData.targetX !== undefined && object.userData.targetY !== undefined) {
                    const lerpSpeed = 0.1;
                    object.position.x += (object.userData.targetX - object.position.x) * lerpSpeed;
                    object.position.y += (object.userData.targetY - object.position.y) * lerpSpeed;
                    
                    // Clear target when close enough
                    if (Math.abs(object.userData.targetX - object.position.x) < 0.1 && 
                        Math.abs(object.userData.targetY - object.position.y) < 0.1) {
                        object.userData.targetX = undefined;
                        object.userData.targetY = undefined;
                    }
                }
                
                // Apply rotating gravity (less strong when object is being controlled)
                const gravityReduction = (selectedObject === object) ? 0.3 : 1.0;
                object.userData.velocity.x += gravityX * gravityReduction;
                object.userData.velocity.y += gravityY * gravityReduction;
                
                // Floating animation with more scaling for depth effect
                const scaleVariation = 1 + Math.sin(time * object.userData.floatSpeed * 0.5 + object.userData.floatOffset) * 0.15;
                object.scale.multiplyScalar(scaleVariation);
                object.position.y += Math.sin(time * object.userData.floatSpeed + object.userData.floatOffset) * 
                    object.userData.floatRange * 0.01;
                // Reset scale for next frame
                object.scale.divideScalar(scaleVariation);
                
                // Rotation - different for images vs 3D models
                if (object.geometry && object.geometry.type === 'PlaneGeometry') {
                    // This is a PNG image - no rotation at all
                    // Keep them facing forward, only allow 3D movement
                } else {
                    // This is a 3D model - rotate on both Y and Z axes
                    object.rotation.y += object.userData.rotationSpeed;
                    object.rotation.z += object.userData.rotationSpeed * 0.3;
                }
                
                // Schwerkraft zu den Rändern - dynamisch basierend auf Fenstergröße
                const windowAspectRatio = window.innerWidth / window.innerHeight;
                const maxX = 9 * windowAspectRatio;
                const maxY = 6;
                const edgeForce = 0.0002;
                const dampening = 0.995;
                
                // Horizontal movement mit Rand-Gravitation
                if (object.position.x > maxX - 2) {
                    object.userData.velocity.x -= edgeForce;
                } else if (object.position.x < -maxX + 2) {
                    object.userData.velocity.x += edgeForce;
                }
                
                // Vertical movement mit Rand-Gravitation
                if (object.position.y > maxY - 1) {
                    object.userData.velocity.y -= edgeForce;
                } else if (object.position.y < -maxY + 1) {
                    object.userData.velocity.y += edgeForce;
                }
                
                // Mouse influence - Objekte werden vom Mauszeiger leicht angezogen/abgestoßen
                const mouseInfluence = 0.00005;
                const dx = mouseX * 10 - object.position.x;
                const dy = mouseY * 6 - object.position.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 5 && distance > 0.1) {
                    // Abstoßung wenn nah
                    object.userData.velocity.x -= (dx / distance) * mouseInfluence * 2;
                    object.userData.velocity.y -= (dy / distance) * mouseInfluence * 2;
                } else if (distance > 5) {
                    // Leichte Anziehung wenn weit weg
                    object.userData.velocity.x += (dx / distance) * mouseInfluence;
                    object.userData.velocity.y += (dy / distance) * mouseInfluence;
                }
                
                // Apply velocity with dampening
                object.userData.velocity.x *= dampening;
                object.userData.velocity.y *= dampening;
                
                object.position.x += object.userData.velocity.x;
                object.position.y += object.userData.velocity.y;
                
                // Bounce off edges - dynamisch basierend auf Fenstergröße
                const bounceAspectRatio = window.innerWidth / window.innerHeight;
                const boundaryX = 9 * bounceAspectRatio;
                const boundaryY = 6;
                
                if (object.position.x > boundaryX || object.position.x < -boundaryX) {
                    object.userData.velocity.x *= -0.8;
                    object.position.x = Math.max(-boundaryX, Math.min(boundaryX, object.position.x));
                }
                if (object.position.y > boundaryY || object.position.y < -boundaryY) {
                    object.userData.velocity.y *= -0.8;
                    object.position.y = Math.max(-boundaryY, Math.min(boundaryY, object.position.y));
                }
                
                // Subtle parallax effect basierend auf Index - allow objects to move in front/behind with more depth
                object.position.z = Math.sin(time * 0.3 + index) * 3 + Math.cos(time * 0.2 + index * 0.5) * 1.5;
            });
            
            // Check for collisions between objects
            checkCollisions();
            
            renderer.render(scene, camera);
        }

        // Window Resize
        window.addEventListener('resize', () => {
            const resizeAspectRatio = window.innerWidth / window.innerHeight;
            const frustumSize = 20;
            
            camera.left = frustumSize * resizeAspectRatio / -2;
            camera.right = frustumSize * resizeAspectRatio / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
